<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#00d4ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<title>Academic Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/responsive.css">

<!-- Third-party libraries: Chart.js for charts, Supabase JS for backend.
     Both are loaded as plain globals (window.Chart / window.supabase)
     so the rest of the app can stay dependency-free ES modules. -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<!-- Google Identity Services — powers the real "Connect Google Calendar"
     OAuth flow in js/calendar.js. Client-side token flow only; no client
     secret is ever needed or used (see README §6). -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<div id="loading">
  <div class="loader"></div>
  <h2>ACADEMIC DASHBOARD</h2>
  <p>Loading…</p>
</div>

<!-- Everything below is rendered by js/app.js depending on auth state:
     login screen → profile setup wizard → full dashboard shell.
     No personal identity, no API secrets, and no business logic live
     in this file — see /js/*.js (README has the full module map). -->
<div id="app-root"></div>

<div id="toast"></div>

<!-- config.js is generated at build time from environment variables
     (see scripts/generate-config.js). It is gitignored — only
     config.example.js (a template with placeholders) is committed. -->
<script src="js/config.js" onerror="console.warn('js/config.js missing — run npm run build:config, see README')"></script>
<script type="module" src="js/app.js"></script>
<script>
  window.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => { const l = document.getElementById('loading'); if (l) l.style.display = 'none'; }, 400);
  });
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW registration failed:', err));
  }
</script>
</body>
</html>
